[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-tumor-be"
version = "0.1.0"
description = "Backend API for Brain Tumor Segmentation workspace"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.135.3",
    "httpx==0.28.1",
    "uvicorn[standard]==0.44.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "sqlalchemy==2.0.49",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.9",
    "nibabel==5.5.0",
    "numpy==2.2.6",
    "scikit-image==0.26.0",
    "python-multipart==0.0.26",
    "PyJWT==2.12.1",
    "cryptography==46.0.5",
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "ruff==0.17.5",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "FAST"]

[tool.ruff.lint.per-file-ignores]
"migrations/**/*.py" = ["E501"]
