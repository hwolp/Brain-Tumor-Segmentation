name: CD - Deploy to Azure VM

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional existing GHCR image tag (e.g. sha-a1b2c3d) to deploy/rollback without rebuilding
        required: false
        default: ""
        type: string
      skip_ci:
        description: Skip CI checks (only honored when deploying an existing image_tag)
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-azure-vm
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Run CI Gates
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && inputs.skip_ci) }}
    uses: ./.github/workflows/ci.yml
    with:
      run_docker_check: false

  build-and-push:
    name: Build & Push Images to GHCR
    needs: [ci]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
    runs-on: ubuntu-24.04
    outputs:
      api_image: ${{ steps.meta.outputs.api_image }}
      web_image: ${{ steps.meta.outputs.web_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute GHCR image metadata
        id: meta
        run: |
          repo_lc="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          echo "api_image=ghcr.io/${repo_lc}-api" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${repo_lc}-web" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          file: ./BE/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.api_image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: ./FE
          file: ./FE/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.web_image }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.web_image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy Stack to Azure VM
    needs: [ci, build-and-push]
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')) }}
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout deploy manifests
        uses: actions/checkout@v4

      - name: Validate deployment configuration and secrets
        id: cfg
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_PORT_RAW: ${{ secrets.AZURE_VM_PORT }}
          AZURE_DEPLOY_DIR_RAW: ${{ secrets.AZURE_DEPLOY_DIR }}
          INPUT_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          BUILT_API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
          BUILT_WEB_IMAGE: ${{ needs.build-and-push.outputs.web_image }}
          BUILT_IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          GHCR_USERNAME_RAW: ${{ secrets.GHCR_USERNAME || github.actor }}
        run: |
          missing=()
          [ -z "$AZURE_VM_HOST" ] && missing+=("AZURE_VM_HOST")
          [ -z "$AZURE_VM_USER" ] && missing+=("AZURE_VM_USER")
          [ -z "$AZURE_VM_SSH_KEY" ] && missing+=("AZURE_VM_SSH_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required Azure VM GitHub secret(s): ${missing[*]}. See deploy/azure/README.md for setup instructions." >&2
            exit 1
          fi

          vm_port="${AZURE_VM_PORT_RAW:-22}"
          if ! [[ "$vm_port" =~ ^[0-9]+$ ]] || [ "$vm_port" -lt 1 ] || [ "$vm_port" -gt 65535 ]; then
            echo "Invalid AZURE_VM_PORT: $vm_port" >&2
            exit 1
          fi

          deploy_dir="${AZURE_DEPLOY_DIR_RAW:-/opt/bts}"
          if ! [[ "$deploy_dir" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid AZURE_DEPLOY_DIR: $deploy_dir" >&2
            exit 1
          fi

          repo_lc="$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          api_image="${BUILT_API_IMAGE:-ghcr.io/${repo_lc}-api}"
          web_image="${BUILT_WEB_IMAGE:-ghcr.io/${repo_lc}-web}"
          image_tag="${INPUT_IMAGE_TAG:-$BUILT_IMAGE_TAG}"

          if ! [[ "$image_tag" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image_tag format: $image_tag" >&2
            exit 1
          fi
          if ! [[ "$GHCR_USERNAME_RAW" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid GHCR username format: $GHCR_USERNAME_RAW" >&2
            exit 1
          fi

          echo "vm_port=${vm_port}" >> "$GITHUB_OUTPUT"
          echo "deploy_dir=${deploy_dir}" >> "$GITHUB_OUTPUT"
          echo "api_image=${api_image}" >> "$GITHUB_OUTPUT"
          echo "web_image=${web_image}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "ghcr_user=${GHCR_USERNAME_RAW}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH client and host verification
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          VM_PORT: ${{ steps.cfg.outputs.vm_port }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/azure_deploy_key
          chmod 600 ~/.ssh/azure_deploy_key

          if [ -n "$AZURE_VM_KNOWN_HOSTS" ]; then
            printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::AZURE_VM_KNOWN_HOSTS is not set; falling back to ssh-keyscan. Pin AZURE_VM_KNOWN_HOSTS in GitHub Secrets for strict MITM protection."
            ssh-keyscan -p "$VM_PORT" -H "$AZURE_VM_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Copy deployment manifests and execute rollout on Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          VM_PORT: ${{ steps.cfg.outputs.vm_port }}
          DEPLOY_DIR: ${{ steps.cfg.outputs.deploy_dir }}
          API_IMAGE: ${{ steps.cfg.outputs.api_image }}
          WEB_IMAGE: ${{ steps.cfg.outputs.web_image }}
          IMAGE_TAG: ${{ steps.cfg.outputs.image_tag }}
          GHCR_USER: ${{ steps.cfg.outputs.ghcr_user }}
          GHCR_PASS: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SSH_OPTS=(-i ~/.ssh/azure_deploy_key -p "$VM_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)

          ssh "${SSH_OPTS[@]}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "mkdir -p '${DEPLOY_DIR}'"

          scp -i ~/.ssh/azure_deploy_key -P "$VM_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/azure/docker-compose.azure.yml \
            deploy/azure/deploy.sh \
            deploy/azure/azure.env.example \
            deploy/azure/nginx.https.conf.example \
            "${AZURE_VM_USER}@${AZURE_VM_HOST}:${DEPLOY_DIR}/"

          ssh "${SSH_OPTS[@]}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "sed -i 's/\r$//' '${DEPLOY_DIR}/deploy.sh' '${DEPLOY_DIR}/docker-compose.azure.yml' '${DEPLOY_DIR}/azure.env.example' '${DEPLOY_DIR}/nginx.https.conf.example' && chmod +x '${DEPLOY_DIR}/deploy.sh'"

          printf '%s\n' "$GHCR_PASS" | ssh "${SSH_OPTS[@]}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "docker login ghcr.io -u '${GHCR_USER}' --password-stdin"

          ssh "${SSH_OPTS[@]}" "${AZURE_VM_USER}@${AZURE_VM_HOST}" \
            "DEPLOY_DIR='${DEPLOY_DIR}' API_IMAGE='${API_IMAGE}' WEB_IMAGE='${WEB_IMAGE}' IMAGE_TAG='${IMAGE_TAG}' '${DEPLOY_DIR}/deploy.sh'"

      - name: Cleanup remote registry session and local SSH key
        if: always()
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          VM_PORT: ${{ steps.cfg.outputs.vm_port }}
        run: |
          if [ -f ~/.ssh/azure_deploy_key ] && [ -n "$AZURE_VM_HOST" ] && [ -n "$AZURE_VM_USER" ] && [ -n "$VM_PORT" ]; then
            ssh -i ~/.ssh/azure_deploy_key -p "$VM_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
              "${AZURE_VM_USER}@${AZURE_VM_HOST}" "docker logout ghcr.io >/dev/null 2>&1 || true" || true
          fi
          rm -f ~/.ssh/azure_deploy_key
